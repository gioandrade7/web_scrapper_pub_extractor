tipo_documento: "Lei Ordinária Federal (Brasil)"
descricao_geral: >
  Leis ordinárias federais brasileiras promulgadas entre 1946 e 2017, obtidas
  do acervo da Câmara dos Deputados em formato RTF. Cada arquivo corresponde a
  uma lei individual, identificada pelo padrão LEI-{ANO}-{NÚMERO}.rtf. Os
  documentos seguem a estrutura hierárquica estabelecida pela Lei Complementar
  nº 95/1998 (Redação das Leis). O corpus abrange legislação de diversas áreas
  temáticas: direito civil, penal, administrativo, tributário, trabalhista e
  setorial.

definicao_bloco: |
  Um bloco corresponde a **uma unidade estrutural hierárquica da lei**
  conforme a Lei Complementar nº 95/1998 (Redação das Leis). Cada bloco
  é identificado por sua categoria estrutural (epígrafe, ementa, preâmbulo,
  caput de artigo, parágrafo, inciso, alínea, item, capítulo, título, seção,
  subseção, livro, parte) e possui um **marcador estrutural próprio**.

  Exemplos de marcadores estruturais:
    - "Art. 1º", "Art. 2º" (caput de artigo — vide regra 2 sobre subelementos)
    - "§ 1º", "§ 2º", "Parágrafo único" (parágrafo)
    - "I –", "II –", "III –" (inciso, em algarismos romanos)
    - "a)", "b)", "c)" (alínea)
    - "1.", "2." (item)
    - "CAPÍTULO I – DAS DISPOSIÇÕES GERAIS" (capítulo)
    - "TÍTULO I – ..." (título)
    - "Seção I – ..." (seção)
    - "LEI Nº 13.080, DE 2 DE JANEIRO DE 2015" (epígrafe)

  O bloco termina antes do próximo marcador de mesmo nível ou de nível
  hierárquico superior.

regras_granularidade: |
  1. **Cada unidade estrutural enumerada** (caput de artigo, parágrafo,
     inciso, alínea, item, capítulo, título, seção, etc.) deve ser
     identificada como um bloco próprio com sua classificação
     correspondente.

  2. **Artigos não geram um bloco "art" englobando o artigo inteiro**:
     o marcador "Art. Nº" sempre dá início a um bloco `cpt` (caput),
     nunca a um bloco que englobe o artigo inteiro com seus
     subelementos. O bloco `cpt` cobre o texto introdutório do artigo —
     do marcador "Art. Nº" até o início do primeiro subelemento
     subordinado (parágrafo, inciso, alínea ou item) ou, se o artigo não
     tiver subelementos, até o final do artigo. Cada subelemento
     subordinado (`par`, `inc`, `ali`, `item`, `pena`, `alt`) é um bloco
     independente adicional, separado do `cpt`.

  3. **Cabeçalhos hierárquicos** (`cap`, `tit`, `sec`, `subsec`, `liv`,
     `prt`) são blocos próprios que contêm APENAS o marcador e o título
     da divisão (ex.: "CAPÍTULO I – DAS DISPOSIÇÕES GERAIS"), sem incluir
     os artigos subordinados — estes são blocos independentes.

  4. **Alterações** (`alt`): trechos de outras leis reproduzidos
     literalmente dentro do corpo de uma lei modificadora são blocos
     independentes, mesmo quando aparecem dentro de um artigo modificador.

  5. **Penas** (`pena`): cláusulas de sanção penal são blocos próprios,
     mesmo quando subordinadas ao caput ou a um parágrafo de tipo penal.

segmentos:

  - nome: "epigrafe"
    descricao: >
      Identificação formal da lei: tipo do ato ("LEI Nº"), número sequencial e
      data de promulgação. Aparece no topo do documento, em caixa-alta e negrito.
      Exemplo: "LEI Nº 13.080, DE 2 DE JANEIRO DE 2015".

  - nome: "ementa"
    descricao: >
      Síntese do objeto da lei, redigida em itálico logo abaixo da epígrafe.
      Resume a matéria regulada e serve como indexador temático.
      Exemplo: "Dispõe sobre as diretrizes para a elaboração e execução da
      Lei Orçamentária de 2015 e dá outras providências."

  - nome: "preambulo"
    descricao: >
      Fórmula de promulgação que precede o articulado. Nas leis federais inclui
      a cláusula "A PRESIDENTA DA REPÚBLICA Faço saber que o Congresso Nacional
      decreta e eu sanciono a seguinte Lei:". Em leis mais antigas pode aparecer
      na forma "O PRESIDENTE DA REPÚBLICA, usando da atribuição que lhe confere
      o art. X da Constituição, decreta:".

  - nome: "cpt"
    descricao: >
      Caput do artigo: bloco SEMPRE presente para cada "Art. Nº", mesmo
      quando o artigo não possui parágrafos, incisos, alíneas ou itens —
      nesse caso o `cpt` corresponde a todo o texto do artigo. Quando há
      subelementos, o `cpt` cobre apenas o texto introdutório, do marcador
      "Art. Nº" até o início do primeiro subelemento subordinado. Não existe
      bloco que englobe o artigo inteiro com seus subelementos: use sempre
      `cpt` + um bloco separado para cada subelemento (`par`, `inc`, `ali`,
      `item`, `pena`, `alt`).
      Exemplo: "Art. 1º  São estabelecidas as diretrizes orçamentárias da
      União para 2015, compreendendo:".

  - nome: "par"
    descricao: >
      Parágrafo do artigo, introduzido por "§ Nº" ou pela expressão
      "Parágrafo único". Estabelece exceções, condições, definições ou
      complementações ao caput. Pode conter incisos e alíneas próprios.

  - nome: "inc"
    descricao: >
      Inciso: subdivisão enumerada em algarismos romanos (ex.: "I –", "II –"),
      subordinada ao caput ou a um parágrafo. Apresenta hipóteses alternativas,
      cumulativas ou itens de uma enumeração.

  - nome: "ali"
    descricao: >
      Alínea: subdivisão do inciso identificada por letra minúscula seguida de
      parêntese (ex.: "a)", "b)"). Detalha ou qualifica as hipóteses do inciso
      ao qual está subordinada.

  - nome: "item"
    descricao: >
      Item: subdivisão da alínea enumerada em algarismos arábicos (ex.: "1.",
      "2."). Nível hierárquico mais granular do articulado, pouco frequente.

  - nome: "alt"
    descricao: >
      Alteração: trecho de outra lei reproduzido literalmente dentro do corpo
      de uma lei modificadora. Ocorre quando a lei em análise dá nova redação,
      acrescenta ou revoga dispositivos de legislação anterior, transcrevendo o
      texto alterado. Pode ser um artigo, parágrafo ou inciso da lei-alvo.

  - nome: "pena"
    descricao: >
      Pena: cláusula de sanção penal contida em artigos de leis penais ou
      com disposições criminais. Identifica-se pela expressão "Pena –" seguida
      da modalidade e do quantum da pena (ex.: "Pena – reclusão, de 2 (dois) a
      4 (quatro) anos, e multa."). Aparece subordinada ao caput ou a um
      parágrafo de tipo penal.

  - nome: "cap"
    descricao: >
      Capítulo: divisão temática da lei composta por número em algarismos
      romanos e título (ex.: "CAPÍTULO I – DAS DISPOSIÇÕES GERAIS"). Agrupa
      artigos relacionados. Número e título são apresentados juntos como um
      único bloco de cabeçalho.

  - nome: "tit"
    descricao: >
      Título: nível hierárquico acima do capítulo, presente em leis extensas e
      códigos (ex.: "TÍTULO I – DOS DIREITOS E DEVERES INDIVIDUAIS"). Agrupa
      capítulos sob uma mesma temática ampla.

  - nome: "sec"
    descricao: >
      Seção: subdivisão do capítulo, identificada por número e título
      (ex.: "Seção I – Da Competência"). Agrupa artigos dentro de um capítulo
      quando a matéria exige partição mais fina.

  - nome: "subsec"
    descricao: >
      Subseção: nível hierárquico abaixo da seção, usado em leis de maior
      complexidade normativa (ex.: "Subseção I – Das Atribuições"). Agrupa
      artigos dentro de uma seção.

  - nome: "liv"
    descricao: >
      Livro: divisão de alto nível presente em códigos e estatutos de grande
      extensão (ex.: "LIVRO I – DA PARTE GERAL"). Agrupa títulos ou capítulos
      sob uma mesma unidade temática maior.

  - nome: "prt"
    descricao: >
      Parte: nível hierárquico mais abrangente da estrutura legal, acima do
      livro. Presente apenas em codificações muito extensas
      (ex.: "PARTE GERAL", "PARTE ESPECIAL"). Divide a lei em grandes blocos
      estruturais.
