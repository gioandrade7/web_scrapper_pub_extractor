tipo_documento: "Diário Oficial da União (DOU) — Seção 2"

descricao_geral: >
  A Seção 2 do Diário Oficial da União é destinada à publicação de atos
  relativos à Gestão de Recursos Humanos da Administração Pública Federal.
  Reúne atos de pessoal que formalizam vínculos funcionais, movimentações,
  concessão de direitos e vantagens, além do exercício do poder disciplinar
  sobre servidores públicos. Sua publicação confere publicidade e validade
  jurídica aos atos que afetam a vida funcional dos servidores.

definicao_bloco: |
  Um bloco corresponde a **um único ato administrativo de gestão de pessoal**,
  tal como é publicado de forma individual no DOU Seção 2. Cada ato possui
  um **identificador próprio** (tipo do ato + número + data, ou tipo do ato +
  data quando o número estiver implícito) e termina, em geral, na assinatura
  do signatário daquele ato específico, imediatamente antes do próximo
  identificador.

  Exemplos de identificadores válidos:
    - "PORTARIA Nº 497, DE 30 DE SETEMBRO DE 2021"
    - "PORTARIA DE PESSOAL SE/CC Nº 241, DE 30 DE SETEMBRO DE 2021"
    - "PORTARIA AGU Nº 313, DE 29 DE SETEMBRO DE 2021"
    - "DESPACHO DE 29 DE SETEMBRO DE 2021"
    - "RETIFICAÇÃO" (quando se refere a um ato específico identificado no corpo)
    - "RESOLUÇÃO Nº 7, DE 28 DE SETEMBRO DE 2021"

  O bloco termina, em geral, na assinatura do signatário daquele ato, OU no
  início do próximo identificador, o que vier primeiro.

regras_granularidade: |
  1. **Atos com identificadores completos distintos** (tipo + número + data)
     são SEMPRE blocos distintos, mesmo quando compartilham:
       - cabeçalho de órgão (ex.: "MINISTÉRIO DA EDUCAÇÃO");
       - preâmbulo idêntico (ex.: "O REITOR ..., resolve:" repetido a cada portaria);
       - mesmo assunto (ex.: 20 portarias de aposentadoria do mesmo órgão = 20 blocos);
       - mesmo signatário.

  2. **Não agrupe por assunto.** O critério de unicidade é o IDENTIFICADOR,
     não o tema. Duas portarias numeradas que tratam do mesmo servidor ainda
     são dois blocos.

  3. **Listas com cabeçalho/preâmbulo compartilhado** (caso especial — atenção):
     - Se cada item da lista tem identificador próprio completo
       (ex.: "PORTARIA Nº 918, DE 30/09/2021" + corpo + assinatura, depois
       "PORTARIA Nº 919, DE 30/09/2021" + corpo + assinatura) → cada item é
       um bloco independente.
     - Se os itens da lista têm apenas número de ordem
       (ex.: "Nº 918 — Conceder...", "Nº 919 — Designar...") dependendo de
       um cabeçalho ("PORTARIAS DE 30/09/2021" + preâmbulo "O COORDENADOR
       ..., resolve:") compartilhado, os itens individuais perderiam
       contexto essencial se extraídos isoladamente. Nesse caso, trate a
       **LISTA INTEIRA** (cabeçalho + preâmbulo + todos os itens + assinatura
       final) como **UM ÚNICO bloco**. Não fragmente itens cujo texto não
       possa ser extraído de forma autossuficiente.

  4. **Retificações, despachos, resoluções e portarias com numeração própria**
     são blocos separados — não os agrupe sob o ato original que retificam
     ou referenciam.

  5. **Anexos, tabelas e listas de servidores DENTRO de um mesmo ato** (sem
     novo identificador) fazem parte desse mesmo bloco.

segmentos:
  - nome: "Provimento e Vacância"
    descricao: >
      Atos relacionados ao início e término de vínculos funcionais, como
      nomeações, exonerações, demissões, aposentadorias, posse e vacância
      de cargos. Formalizam a entrada, saída ou alteração do status
      funcional de servidores.

  - nome: "Movimentação de Pessoal"
    descricao: >
      Documentos que registram mudanças na lotação ou atribuições de
      servidores sem romper o vínculo, como remoções, redistribuições,
      cessões, requisições e designações. Tratam da alocação de recursos
      humanos entre unidades administrativas.

  - nome: "Direitos e Vantagens"
    descricao: >
      Atos que concedem benefícios e vantagens funcionais, incluindo
      promoções, progressões, gratificações, adicionais, concessão de
      férias, licenças e auxílios. Reconhecem direitos decorrentes da
      relação funcional estabelecida.

  - nome: "Atos Disciplinares"
    descricao: >
      Documentos relativos ao exercício do poder disciplinar, como
      instauração de processos administrativos disciplinares, aplicação
      de penalidades (advertências, suspensões, demissões), absolvições
      e arquivamentos. Regulam a responsabilização administrativa de
      servidores.
